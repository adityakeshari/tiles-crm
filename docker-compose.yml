services:
  db:
    image: postgres:16-alpine
    container_name: tiles-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tiles_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro

  backend:
    build:
      context: ./backend
    container_name: tiles-crm-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tiles_crm
      JWT_SECRET: change-me
      ALLOWED_ORIGINS: http://localhost:8080
    depends_on:
      - db
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: tiles-crm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
